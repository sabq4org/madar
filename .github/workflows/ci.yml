name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_USER: madar
          POSTGRES_PASSWORD: madar_ci_only
          POSTGRES_DB: madar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U madar -d madar"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://madar:madar_ci_only@127.0.0.1:5432/madar
      NODE_ENV: test
      ENABLE_NETWORK_INGESTION: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:integration
      - run: pnpm audit --prod --audit-level=high
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t madar:ci .
      - run: node scripts/env-init.mjs
      - run: docker compose -f compose.yaml -f compose.ci.yaml --profile app up -d --no-build
      - run: docker compose -f compose.yaml -f compose.ci.yaml --profile app run --rm -e NODE_ENV=development migrate pnpm db:seed
      - run: node scripts/smoke.mjs
      - if: failure()
        run: docker compose -f compose.yaml -f compose.ci.yaml --profile app logs --tail=60
      - if: always()
        run: docker compose -f compose.yaml -f compose.ci.yaml --profile app down
