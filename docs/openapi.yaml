openapi: 3.1.0
info:
  title: Madar Foundation API
  version: 0.1.0
  description: Local phase-one API. Synthetic sources are visible in development only. Rights approval is not factual verification.
servers:
  - url: http://127.0.0.1:4100
paths:
  /health/live:
    get:
      summary: API process liveness
      responses:
        "200": { description: Process responds }
  /health/ready:
    get:
      summary: Database connectivity and all expected application migrations
      responses:
        "200": { description: Database and migrations ready }
        "503": { description: Database unavailable or required migration missing }
  /v1/sources:
    get:
      summary: Public source metadata (no feed URLs or rights basis)
      responses:
        "200":
          description: Sources
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Source" } }
  /v1/articles:
    get:
      summary: Approved-source articles ordered by firstSeenAt and id descending
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - in: query
          name: before
          description: Opaque nextCursor from previous response; base64url of timestamp and UUID. Do not construct from publishedAt.
          schema: { type: string, maxLength: 512 }
      responses:
        "200":
          description: Article page
          content:
            application/json:
              schema:
                type: object
                required: [data, nextCursor]
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Article" } }
                  nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }
  /v1/articles/{id}:
    get:
      summary: Article and descending content revisions
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Detail; excerpts respect current source policy
          content:
            application/json:
              schema:
                type: object
                required: [data, revisions]
                properties:
                  data: { $ref: "#/components/schemas/Article" }
                  revisions:
                    type: array
                    items:
                      type: object
                      required: [id, title, excerpt, observedAt]
                      properties:
                        id: { type: string, format: uuid }
                        title: { type: string }
                        excerpt: { type: [string, "null"] }
                        observedAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { description: Article absent or source rights withdrawn }
  /v1/admin/sources:
    post:
      security: [{ AdminBearer: [] }]
      summary: Register RSS source (disabled and pending by default)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSource" }
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: Feed URL already registered }
        "503": { description: Admin key not configured }
  /v1/admin/sources/{id}:
    patch:
      security: [{ AdminBearer: [] }]
      summary: Enable, pause, approve, block or change content policy
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                enabled: { type: boolean }
                rightsStatus: { type: string, enum: [pending, approved, blocked] }
                rightsBasis: { type: string, minLength: 20, maxLength: 2000 }
                contentPolicy: { type: string, enum: [metadata_only, excerpt] }
      responses:
        "200":
          description: Updated; approved state requires recorded rights basis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Source absent }
  /v1/admin/sources/{id}/collect:
    post:
      security: [{ AdminBearer: [] }]
      summary: Enqueue approved enabled source; duplicate outstanding job is suppressed
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "202":
          description: queued false means an outstanding job already exists
          content:
            application/json:
              schema:
                type: object
                required: [jobId, queued]
                properties:
                  jobId: { type: [string, "null"], format: uuid }
                  queued: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Source absent }
        "409":
          {
            description: Source not approved/enabled,
            network disabled,
            or fixture prohibited in production,
          }
components:
  securitySchemes:
    AdminBearer:
      {
        type: http,
        scheme: bearer,
        description: Server-side operator key; never a browser credential,
      }
  parameters:
    Id: { in: path, name: id, required: true, schema: { type: string, format: uuid } }
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid admin key
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        fields: { type: array, items: { type: string } }
    IdResult:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }
    Source:
      type: object
      required: [id, name, homepageUrl, kind, enabled, rightsStatus]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        homepageUrl: { type: string, format: uri }
        kind: { type: string, enum: [rss, fixture] }
        enabled: { type: boolean }
        rightsStatus: { type: string, enum: [pending, approved, blocked] }
    Article:
      type: object
      required:
        [
          id,
          sourceId,
          sourceName,
          canonicalUrl,
          title,
          excerpt,
          publishedAt,
          firstSeenAt,
          lastSeenAt,
          revisionCount,
          isDemo,
        ]
      properties:
        id: { type: string, format: uuid }
        sourceId: { type: string, format: uuid }
        sourceName: { type: string }
        canonicalUrl: { type: string, format: uri }
        title: { type: string }
        excerpt: { type: [string, "null"] }
        publishedAt: { type: [string, "null"], format: date-time }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        revisionCount: { type: integer, minimum: 1 }
        isDemo: { type: boolean }
    CreateSource:
      type: object
      additionalProperties: false
      required: [name, homepageUrl, feedUrl, allowedHosts]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        homepageUrl:
          {
            type: string,
            format: uri,
            maxLength: 2048,
            description: HTTPS,
            no credentials,
            port443 only,
          }
        feedUrl:
          {
            type: string,
            format: uri,
            maxLength: 2048,
            description: HTTPS on an explicitly allowed host,
          }
        allowedHosts:
          type: array
          minItems: 1
          maxItems: 10
          items: { type: string, maxLength: 253 }
        enabled: { type: boolean, default: false }
        rightsStatus: { type: string, enum: [pending, approved, blocked], default: pending }
        rightsBasis:
          { type: string, minLength: 20, maxLength: 2000, description: Required for approved state }
        contentPolicy: { type: string, enum: [metadata_only, excerpt], default: metadata_only }
        pollIntervalSeconds: { type: integer, minimum: 60, maximum: 86400, default: 300 }
